# Dashboard theme (run from the repo root: streamlit run dashboard/app.py).
# Near-black + one yellow interface accent, one tight grotesk. Tier colours live in
# src/tiering.py TIER_COLORS; the yellow accent never encodes data.
[theme]
base = "dark"
primaryColor = "#FFD600"              # interface accent only: tabs, sliders, active states
backgroundColor = "#101010"
secondaryBackgroundColor = "#1A1A1A"
textColor = "#F2F2F2"
borderColor = "#262626"
dataframeBorderColor = "#262626"
dataframeHeaderBackgroundColor = "#161616"
linkColor = "#FFD600"
redColor = "#F2386F"                  # = CRITICAL
orangeColor = "#FF8A3D"               # = ELEVATED
yellowColor = "#FFD600"
blueColor = "#8A8A8A"                 # info boxes stay grey, unlike SAFE steel blue
greenColor = "#8A8A8A"
font = "Inter Tight:https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&display=swap"
headingFont = "Inter Tight:https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
headingFontWeights = [800, 800, 600, 600, 600, 600]
baseRadius = "12px"
showWidgetBorder = false

[theme.sidebar]
backgroundColor = "#0C0C0C"
secondaryBackgroundColor = "#1A1A1A"
